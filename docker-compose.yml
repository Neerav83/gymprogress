name: gymprogress

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymprogress
      POSTGRES_USER: gymprogress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymprogress -d gymprogress"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/GymProgress.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=gymprogress;Username=gymprogress;Password=${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:4200}
      AI__BaseUrl: http://host.docker.internal:1234
      AI__Model: ${AI_MODEL:-}
      AI__TimeoutSeconds: 90
      Jwt__Issuer: GymProgress
      Jwt__Audience: GymProgress
      Jwt__Key: ${JWT_KEY:?Sätt JWT_KEY i .env}
      Jwt__ExpirationDays: 30
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -qi healthy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
