<app-toast-container />
<app-rest-timer />
<app-confirm-dialog />

<div class="app-shell" [class.guest]="!auth.isLoggedIn()">
  <router-outlet />
</div>

@if (auth.isLoggedIn()) {
  <nav class="tabbar" aria-label="Huvudmeny">
    <a routerLink="/history" routerLinkActive="active">Historik</a>
    <a routerLink="/templates" routerLinkActive="active">Mallar</a>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="home-btn">Hem</a>
    <a routerLink="/records" routerLinkActive="active">Rekord</a>
    <a routerLink="/profile" routerLinkActive="active">Profil</a>
  </nav>
}
