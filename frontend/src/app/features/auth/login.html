<header class="hero">
  <img class="brand-mark" src="/icon-192.png" width="192" height="192" alt="Gym Progress" />
  <p class="page-kicker">Gym Progress</p>
  <h1 class="page-title">Nästa rekord börjar här.</h1>
  <p class="lede muted">Logga passen. Följ kurvan. Bli starkare än igår.</p>
</header>

<form class="card form" (ngSubmit)="submit()">
  <label class="field">
    <span>E-post</span>
    <input type="email" name="email" autocomplete="username webauthn" [(ngModel)]="email" required />
  </label>
  <label class="field">
    <span>Lösenord</span>
    <input type="password" name="password" autocomplete="current-password webauthn" [(ngModel)]="password" required />
  </label>
  @if (error(); as message) {
    <p class="form-error">{{ message }}</p>
  }
  <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Loggar in…' : 'Kör igång' }}
  </button>
</form>

<p class="switch">
  Inget konto?
  <a routerLink="/register">Skapa ett</a>
</p>
