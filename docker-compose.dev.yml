services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymprogress
      POSTGRES_USER: gymprogress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymprogress}
    ports:
      - "5433:5432"
    volumes:
      - gymprogress_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymprogress -d gymprogress"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymprogress_dev_data:
