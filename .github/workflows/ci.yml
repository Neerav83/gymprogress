name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test GymProgress.slnx --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CI secrets
        run: |
          echo "POSTGRES_PASSWORD=ci-postgres-password" > .env
          echo "JWT_KEY=ci-jwt-key-must-be-at-least-32-chars!" >> .env
          echo "CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80" >> .env
          echo "WEB_PORT=80" >> .env

      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost/health
          curl -fsS http://localhost:5080/health
          curl -fsS http://localhost/ | grep -qi 'app-root'
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/api/v1/exercises)"
          test "$status" = "401"

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
